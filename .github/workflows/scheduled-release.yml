name: Scheduled release

# Cuts a GitHub Release of main at noon and 6 p.m. Central, as the iOS app does
# (opencode-ios scheduled-release.yml), then starts the Android workflow on its v* tag,
# which ships to Google Play internal and open testing (docs/releasing.md). Skips when
# main has nothing new since the last release or its commit hasn't passed CI.
on:
  schedule:
    # GitHub cron is UTC. These cover noon and 6 p.m. in both CST and CDT;
    # the hour check below drops the two that don't match.
    - cron: "0 0,17,18,23 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: scheduled-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check the time
        id: time
        run: |
          hour=$(TZ=America/Chicago date +%H)
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$hour" != 12 ] && [ "$hour" != 18 ]; then
            echo "Not a release hour in Chicago ($hour); skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.time.outputs.skip != 'true'
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Cut the release
        if: steps.time.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          if git tag --points-at "$sha" | grep -q '^v'; then
            echo "main ($sha) is already released as $(git tag --points-at "$sha" | grep '^v' | head -1); skipping."
            exit 0
          fi
          # Only release a commit whose push run on main passed (android.yml then skips
          # scripts/check.sh on the tag). A run still going retries at the next release time.
          status=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow android.yml --branch main --event push --commit "$sha" --json conclusion --jq '.[0].conclusion')
          if [ "$status" != success ]; then
            echo "main ($sha) hasn't passed android.yml (latest run: ${status:-none or still running}); skipping."
            exit 0
          fi
          tag="v$(scripts/version.sh "$sha")"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists; skipping."
            exit 0
          fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$sha" --title "$tag" --generate-notes
          # A tag pushed with GITHUB_TOKEN doesn't start other workflows (iOS doesn't need
          # this: Xcode Cloud watches tags itself), so run the Android workflow on the tag.
          gh workflow run android.yml --repo "$GITHUB_REPOSITORY" --ref "$tag"
          echo "Released $tag at $sha and started android.yml on it" >> "$GITHUB_STEP_SUMMARY"
