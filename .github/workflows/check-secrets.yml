# Temporary: proves the release role can read the migrated secrets with the env var names
# android.yml uses, including through the `env` context in a step's inputs.
# workflow_dispatch only; deleted once checked.
name: check-secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::604439173067:role/github/opencode-android-release
          role-session-name: check-${{ github.run_id }}
          aws-region: us-east-1
      - uses: aws-actions/aws-secretsmanager-get-secrets@2297f9a879480a9e3af9b293ed15c70caf8e1c88 # v3.0.2
        with:
          secret-ids: |
            ANDROID_UPLOAD_KEYSTORE_BASE64,opencode-android/release/ANDROID_UPLOAD_KEYSTORE_BASE64
            ANDROID_UPLOAD_KEYSTORE_PASSWORD,opencode-android/release/ANDROID_UPLOAD_KEYSTORE_PASSWORD
            PLAY_SERVICE_ACCOUNT_JSON,opencode-android/release/PLAY_SERVICE_ACCOUNT_JSON
          parse-json-secrets: false
      - name: Check
        run: |
          test -n "$ANDROID_UPLOAD_KEYSTORE_BASE64" && echo ANDROID_UPLOAD_KEYSTORE_BASE64 ok
          test -n "$ANDROID_UPLOAD_KEYSTORE_PASSWORD" && echo ANDROID_UPLOAD_KEYSTORE_PASSWORD ok
          test -n "$PLAY_SERVICE_ACCOUNT_JSON" && echo PLAY_SERVICE_ACCOUNT_JSON ok
      # android.yml passes PLAY_SERVICE_ACCOUNT_JSON to the upload action as
      # `serviceAccountJsonPlainText: ${{ env.PLAY_SERVICE_ACCOUNT_JSON }}`, so the env
      # context has to resolve a value written to GITHUB_ENV by the previous step.
      - name: Check the env context
        env:
          FROM_CONTEXT: ${{ env.PLAY_SERVICE_ACCOUNT_JSON }}
          BASE64_CONTEXT: ${{ env.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          test -n "$FROM_CONTEXT" && echo "env context: PLAY_SERVICE_ACCOUNT_JSON ok"
          test -n "$BASE64_CONTEXT" && echo "env context: ANDROID_UPLOAD_KEYSTORE_BASE64 ok"
      - name: Check the JSON parses
        run: printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" | jq -er '.client_email | strings' > /dev/null && echo PLAY_SERVICE_ACCOUNT_JSON parses
