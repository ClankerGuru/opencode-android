# Temporary: copies this repo's remaining GitHub secrets into AWS Secrets Manager and
# checks they come back through the release role. workflow_dispatch only; deleted once the
# workflows read from AWS.
name: migrate-secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::604439173067:role/github/opencode-android-release
          role-session-name: migrate-${{ github.run_id }}
          aws-region: us-east-1
      - name: Copy ANDROID_UPLOAD_KEYSTORE_BASE64
        env:
          V: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: aws secretsmanager put-secret-value --secret-id opencode-android/release/ANDROID_UPLOAD_KEYSTORE_BASE64 --secret-string "$V" > /dev/null
      - name: Copy ANDROID_UPLOAD_KEYSTORE_PASSWORD
        env:
          V: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
        run: aws secretsmanager put-secret-value --secret-id opencode-android/release/ANDROID_UPLOAD_KEYSTORE_PASSWORD --secret-string "$V" > /dev/null
      - name: Copy PLAY_SERVICE_ACCOUNT_JSON
        env:
          V: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: aws secretsmanager put-secret-value --secret-id opencode-android/release/PLAY_SERVICE_ACCOUNT_JSON --secret-string "$V" > /dev/null
      # The upload key alias is not a secret; print it so it can become a repo variable.
      - name: Read the upload key alias
        continue-on-error: true
        env:
          K: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          P: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          umask 077
          f="$RUNNER_TEMP/upload.p12"
          printf '%s' "$K" | base64 -d > "$f"
          out=$(keytool -list -keystore "$f" -storepass "$P" 2>&1) || out=$(keytool -list -keystore "$f" -storetype JKS -storepass "$P" 2>&1)
          rm -f "$f"
          printf '%s\n' "$out" | grep 'PrivateKeyEntry' | cut -d, -f1 | sed 's/^ *//'

  verify:
    needs: migrate
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::604439173067:role/github/opencode-android-release
          role-session-name: verify-${{ github.run_id }}
          aws-region: us-east-1
      - uses: aws-actions/aws-secretsmanager-get-secrets@2297f9a879480a9e3af9b293ed15c70caf8e1c88 # v3.0.2
        with:
          secret-ids: |
            ANDROID_UPLOAD_KEYSTORE_BASE64,opencode-android/release/ANDROID_UPLOAD_KEYSTORE_BASE64
            ANDROID_UPLOAD_KEYSTORE_PASSWORD,opencode-android/release/ANDROID_UPLOAD_KEYSTORE_PASSWORD
            PLAY_SERVICE_ACCOUNT_JSON,opencode-android/release/PLAY_SERVICE_ACCOUNT_JSON
          parse-json-secrets: false
      - name: Check
        run: |
          test -n "$ANDROID_UPLOAD_KEYSTORE_BASE64" && echo ANDROID_UPLOAD_KEYSTORE_BASE64 ok
          test -n "$ANDROID_UPLOAD_KEYSTORE_PASSWORD" && echo ANDROID_UPLOAD_KEYSTORE_PASSWORD ok
          test -n "$PLAY_SERVICE_ACCOUNT_JSON" && echo PLAY_SERVICE_ACCOUNT_JSON ok
